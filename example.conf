# Example configuration for dog-editor-inputleap
# Hostname/Screen names can be checked using `hostname` command

section: screens
    server-pc:
    client-pc:
end

section: links
    server-pc:
        right = client-pc
    client-pc:
        left  = server-pc
end

section: options
    relativeMouseMoves = false
    screenSaverSync = false
end
